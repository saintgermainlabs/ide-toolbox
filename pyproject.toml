[project]
name = "ide-toolbox"
version = "0.1.0"
description = "Read-only Ubuntu desktop inventory of vibe-coding / IDE tools (PySide6)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["PySide6==6.9.2", "PyYAML>=6.0,<7"]

[project.scripts]
ide-toolbox = "ide_toolbox.app:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ide_toolbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
